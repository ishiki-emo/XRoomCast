# PC配信の中継アプリ(apps/bridge)を、Node.js なしで動く実行ファイルにして GitHub Releases に置く。
# タグ bridge-v<版>(例: bridge-v0.1.0)を push すると動く。手動でも動かせる(そのときは成果物だけ残す)
name: bridge-release

on:
  push:
    tags: ['bridge-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ネイティブアドオン(node-datachannel)が OS ごとに違うので、各 OS のランナーでビルドする
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: xroomcast-bridge-windows-x64.exe
            zip: xroomcast-bridge-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # SEA の blob は注入先と同じ版の node で作る(build-exe.mjs は自分自身の node を複製する)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:exe -w apps/bridge
      - name: zip にまとめる
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item apps/bridge/dist/${{ matrix.exe }} package/
          Copy-Item apps/bridge/配布用/はじめにお読みください.txt package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
      - name: リリースに添付する
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
