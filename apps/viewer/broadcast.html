<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎙</text></svg>" />
    <title>配信者コンソール - 音声</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      .sub {
        color: #aaa;
        font-size: 13px;
        margin: 0 0 24px;
      }
      #b-status {
        padding: 10px 14px;
        border-radius: 8px;
        background: #1e1e1e;
        border: 1px solid #333;
        font-size: 14px;
        min-height: 1.4em;
      }
      #b-status.live {
        border-color: #3a5f3a;
        color: #8fa;
      }
      #b-status.error {
        border-color: #5f3a3a;
        color: #ff6b6b;
      }
      #b-toggle {
        margin-top: 16px;
        width: 100%;
        padding: 14px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid #444;
        background: #2d4a2d;
        color: #eee;
        cursor: pointer;
      }
      #b-toggle.live {
        background: #5f3a3a;
      }
      #b-toggle:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .note {
        margin-top: 20px;
        color: #999;
        font-size: 13px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h1>🎙 配信者コンソール(音声)</h1>
      <p class="sub">このページを開いている間だけ、マイク音声が視聴ページへ配信されます</p>
      <div id="b-status">待機中</div>
      <button id="b-toggle">マイク配信を開始</button>
      <p class="note">
        ・音声はCloudflare Realtime SFUの音声トラック(Opus)として配信されます<br />
        ・ポーズ配信(VSeeFace+ブリッジ)とは独立して動きます<br />
        ・タブを閉じる/停止ボタンで配信は止まります
      </p>
    </div>
    <script type="module" src="/src/broadcast.ts"></script>
  </body>
</html>
