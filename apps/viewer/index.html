<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎭</text></svg>" />
    <title>VRM Sync Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #212121;
      }
      canvas {
        display: block;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        max-width: min(480px, calc(100vw - 24px));
      }
      #ui .row {
        display: flex;
        gap: 6px;
      }
      #vrm-url,
      #ws-url {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #555;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #eee;
        font-size: 13px;
      }
      #ws-button,
      #load-button {
        padding: 6px 14px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #3a3a3a;
        color: #eee;
        cursor: pointer;
      }
      #load-button:hover:not(:disabled) {
        background: #4a4a4a;
      }
      #load-button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #demo-button {
        padding: 6px 14px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2d4a2d;
        color: #eee;
        cursor: pointer;
      }
      #demo-button:hover {
        background: #3a5f3a;
      }
      #demo-button.active {
        background: #5f3a3a;
      }
      #ui label {
        color: #eee;
        display: flex;
        align-items: center;
        gap: 4px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      #status {
        color: #eee;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      #status.error {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div class="row">
        <input id="vrm-url" type="text" placeholder="VRMのURLを入力(例: https://.../model.vrm)" spellcheck="false" />
        <button id="load-button">ロード</button>
      </div>
      <div class="row">
        <input id="ws-url" type="text" value="ws://localhost:8080" spellcheck="false" />
        <button id="ws-button">接続</button>
      </div>
      <div class="row">
        <button id="demo-button">デモ再生</button>
        <label><input type="checkbox" id="drop-checkbox" /> パケット10%ドロップ</label>
      </div>
      <div id="status">VRM 読み込み中...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
